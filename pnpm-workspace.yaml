pmOnFail: error
allowBuilds:
  esbuild: true
  lefthook: true
  sharp: true
minimumReleaseAgeExclude:
  - '@astrojs/vercel@11.0.1'

# TODO: drop each override once its parent ships a release that resolves the advisory
# on its own — `pnpm why <pkg>` says when.
overrides:
  # GHSA-9wv6-86v2-598j — backtracking regex, transitive through
  # @astrojs/vercel > @vercel/routing-utils and bundled into the deployed function.
  path-to-regexp@<6.3.0: '>=6.3.0'
  # GHSA-mh99-v99m-4gvg + GHSA-rgw5-rvv9-x895 — unbounded expansion. Dev-only
  # (ts-morph > @ts-morph/common > minimatch), never in the shipped bundle.
  brace-expansion@<5.0.9: '>=5.0.9'
