name: Deploy

# [HARD] `workflow_dispatch` exists so the emergency route is the gated route: rebuilding
# production without a code change goes through this chain, never `vercel --prod` by hand.
on:
  workflow_call:
    inputs:
      ref:
        description: 'Release tag to deploy'
        required: true
        type: string
  workflow_dispatch:
    inputs:
      ref:
        description: 'Release tag to deploy (blank = the most recent tag)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  check-vercel-secrets:
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - id: check
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -n "$VERCEL_TOKEN" ] && [ -n "$VERCEL_ORG_ID" ] && [ -n "$VERCEL_PROJECT_ID" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Vercel secrets not set yet — skipping production deploy. See HOW_TO_USE.md for the setup checklist."
          fi

  deploy:
    name: Deploy to Vercel production
    needs: check-vercel-secrets
    if: ${{ needs.check-vercel-secrets.outputs.configured == 'true' }}
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      # actions/checkout fetches no tags at its default depth; `git describe` below needs them.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # `inputs.ref` reaches the shell through env: splicing `${{ }}` into a `run:` block is
      # script injection (GitHub Actions security hardening).
      - name: Resolve the tag to deploy
        id: target
        env:
          REQUESTED_REF: ${{ inputs.ref }}
        run: |
          ref="$REQUESTED_REF"
          if [ -z "$ref" ]; then
            ref=$(git describe --tags --abbrev=0) || {
              echo "::error::no tag in this repository — production ships from a release tag, so there is nothing to deploy yet"
              exit 1
            }
            echo "::notice::No ref given — deploying the most recent tag ($ref)."
          fi
          if ! git rev-parse -q --verify "refs/tags/$ref" > /dev/null; then
            echo "::error::$ref is not a tag — production ships from release tags only"
            exit 1
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Check out the tag
        env:
          TARGET_REF: ${{ steps.target.outputs.ref }}
        run: git checkout --detach "refs/tags/$TARGET_REF"

      - run: corepack enable

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      # `vercel build` below runs `astro build` alone — no Biome, no astro check, no vitest.
      - run: pnpm run ci

      # `pnpm dlx` resolves latest at run time and Dependabot doesn't scan it: bump the pin by hand.
      - run: pnpm dlx vercel@58 pull --yes --environment=production

      - run: pnpm dlx vercel@58 build --prod

      - name: Deploy to Vercel production
        id: deploy
        run: |
          url=$(pnpm dlx vercel@58 deploy --prebuilt --prod)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed to: $url"

      # `astro dev` never reads vercel.json: headers and rewrites are exercised for real only here.
      - name: Smoke test production
        run: pnpm run smoke:prod
