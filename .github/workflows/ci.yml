name: CI

on:
  pull_request:
  push:
    branches: [main]

# Declared rather than inherited: this workflow runs on PRs, so it is the one a
# third-party action would ride in on. It only reads the checkout.
permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - run: corepack enable

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - run: pnpm run ci

      - run: pnpm run build

      # Reads dist/client, so it has to follow the build.
      - run: pnpm run perf:bundle
