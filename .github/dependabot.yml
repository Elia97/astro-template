version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    labels:
      - 'dependencies'
    # [HARD] release-please bumps the version on `feat`/`fix` alone, so under
    # `chore(deps)` a merged CVE patch never cuts a tag and never reaches production.
    commit-message:
      prefix: 'fix(deps)'
      prefix-development: 'fix(deps-dev)'
    cooldown:
      default-days: 7
      semver-major-days: 14
    ignore:
      # TODO: drop when astro supports TS 7. `astro check` uses the TypeScript
      # programmatic API, which 7.x does not ship. withastro/roadmap#1321
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
    groups:
      # Two ungrouped PRs merged seconds apart once auto-merged their pnpm-lock.yaml
      # into a hybrid with a duplicated key: unparsable YAML, CI down until repaired.
      npm:
        patterns:
          - '*'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    labels:
      - 'github-actions'
    # `chore` on purpose, unlike the npm group above: an action version never
    # enters the deployed artifact, so these have nothing to publish.
    commit-message:
      prefix: 'chore(deps)'
    groups:
      github-actions:
        patterns:
          - '*'
